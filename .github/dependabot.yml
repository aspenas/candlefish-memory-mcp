version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/pkg/glama"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/test-infrastructure"
    schedule:

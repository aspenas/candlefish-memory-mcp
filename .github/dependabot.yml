# Weekly Monday Dependabot version updates grouped into one PR per ecosystem (open PR limit 2).
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/pkg/glama"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    groups:
      docker-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/test-infrastructure"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
